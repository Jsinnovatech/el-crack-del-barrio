version: '3.9'

services:
  # BD local (solo para desarrollo sin internet)
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: vitrina
      POSTGRES_PASSWORD: vitrina123
      POSTGRES_DB: vitrina_deportiva
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrina -d vitrina_deportiva"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  pg_data:
